services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tictactoe
    ports:
      - "5432:5432"
    volumes:
      - tictactoe-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tictactoe"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/TicTacToe.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=tictactoe;Username=postgres;Password=postgres
      Jwt__Key: dev-only-jwt-signing-key-change-me-please-0123456789abcdef
      Jwt__Issuer: tic-tac-toe-api
      Jwt__Audience: tic-tac-toe-client
      Cors__Origins: http://localhost:8080
    ports:
      - "8081:8080"
    volumes:
      - tictactoe-logs:/app/Logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:9.19
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tictactoe.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"

volumes:
  tictactoe-pgdata:
  tictactoe-logs:
